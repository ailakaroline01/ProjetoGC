<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sobre você - Criar Portfólio</title>
    <!-- Referência ao CSS na pasta correspondente -->
    <link rel="stylesheet" href="../css/forms.css">
</head>

<body>

    <header>
        <div class="logo">folio<span>.</span></div>
        <nav class="header-nav">
            <a href="index.html">Início</a>
            <a href="sobre-voce.html" class="btn-header">Criar portfólio</a>
            <a href="visualizar.html">Visualizar</a>
        </nav>
    </header>

    <div class="container">
        <div class="page-header">
            <h2>Seu espaço de criação</h2>
            <h1>Vamos montar seu portfólio</h1>
            <p>Uma etapa de cada vez, do seu jeito.</p>
        </div>

        <main class="main-content">
            <aside class="sidebar">
                <a href="sobre-voce.html" class="step active">01 · Sobre você</a>
                <a href="projetos.html" class="step">02 · Projetos</a>
                <a href="#" class="step">03 · Habilidades</a>
            </aside>

            <section class="card">
                <h3>Sobre você</h3>
                <p>Apresente-se a quem vai conhecer seu trabalho</p>

                <div class="input-group">
                    <label for="skillInput">Nome Completo*</label>
                    <input type="text" id="skillInput" placeholder="Ex.: João da Silva" aria-describedby="errorMsg">
                    <div id="errorMsg" class="error-message"></div>
                </div>
                <div class="input-group">
                    <label for="skillInput">Titulo Profissional</label>
                    <input type="text" id="skillInput" placeholder="Ex.: Desenvolvedor Web" aria-describedby="errorMsg">
                    <div id="errorMsg" class="error-message"></div>
                </div>
                <div class="input-group">
                    <label for="skillInput">Apresentação</label>
                    <input type="text" id="skillInput" placeholder="Ex.: Desenvolvedor web com 5 anos de experiência em desenvolvimento de aplicações web." aria-describedby="errorMsg">
                    <div id="errorMsg" class="error-message"></div>
                </div>
                <div class="input-group">
                    <label for="skillInput">Email*</label>
                    <input type="email" id="skillInput" placeholder="Ex.: joao.silva@example.com" aria-describedby="errorMsg">
                    <div id="errorMsg" class="error-message"></div>
                </div>
                <div class="input-group">
                    <label for="skillInput">Link Profissional</label>
                    <input type="text" id="skillInput" placeholder="Ex.: https://github.com/usuario" aria-describedby="errorMsg">
                    <div id="errorMsg" class="error-message"></div>
                </div>
        
                <div class="card-footer">
                    <button type="button" id="btnBack" class="btn-outline">← Voltar ao início</button>
                    <button type="button" id="btnFinish" class="btn-primary">Continuar →</button>
                </div>
            </section>
        </main>
    </div>

    <!-- Referência ao JS na pasta correspondente -->
    <script src="../js/habilidades.js"></script>
</body>

</html>
