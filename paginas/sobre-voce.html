<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sobre você - Criar Portfólio</title>
    <!-- Referência ao CSS na pasta correspondente -->
    <link rel="stylesheet" href="../css/forms.css">
</head>

<body>

    <header>
        <div class="logo">folio<span>.</span></div>
        <nav class="header-nav">
            <a href="index.html">Início</a>
            <a href="sobre-voce.html" class="btn-header">Criar portfólio</a>
            <a href="visualizar.html">Visualizar</a>
        </nav>
    </header>

    <div class="container">
        <div class="page-header">
            <h2>Seu espaço de criação</h2>
            <h1>Vamos montar seu portfólio</h1>
            <p>Uma etapa de cada vez, do seu jeito.</p>
        </div>

        <main class="main-content">
            <aside class="sidebar">
                <a href="sobre-voce.html" class="step active">01 · Sobre você</a>
                <a href="projetos.html" class="step">02 · Projetos</a>
                <a href="habilidades.html" class="step">03 · Habilidades</a>
            </aside>

            <form id="profile-form" class="card">
                <h3>Sobre você</h3>
                <p>Apresente-se a quem vai conhecer seu trabalho</p>

                <div class="profile-fields">
                <div class="input-group">
                    <label for="nome">Nome Completo*</label>
                    <input required type="text" id="nome" placeholder="Ex.: João da Silva" aria-describedby="nomeError">
                    <div id="nomeError" class="error-message"></div>
                </div>
                <div class="input-group">
                    <label for="profissao">Titulo Profissional</label>
                    <input type="text" id="profissao" placeholder="Ex.: Desenvolvedor Web" aria-describedby="profissaoError">
                    <div id="profissaoError" class="error-message"></div>
                </div>
                <div class="input-group input-group-wide">
                    <label for="bio">Apresentação</label>
                    <textarea id="bio" rows="4" placeholder="Ex.: Desenvolvedor web com 5 anos de experiência em desenvolvimento de aplicações web." aria-describedby="bioError"></textarea>
                    <div id="bioError" class="error-message"></div>
                </div>
                <div class="input-group">
                    <label for="email">Email*</label>
                    <input required type="email" id="email" placeholder="Ex.: joao.silva@example.com" aria-describedby="emailError">
                    <div id="emailError" class="error-message"></div>
                </div>
                <div class="input-group">
                    <label for="link">Link Profissional</label>
                    <input type="url" id="link" placeholder="Ex.: https://github.com/usuario" aria-describedby="linkError">
                    <div id="linkError" class="error-message"></div>
                </div>
        
                </div>

                <div class="card-footer">
                    <button type="button" id="btnBack" class="btn-outline">← Voltar ao início</button>
                    <button type="submit" id="btnFinish" class="btn-primary">Continuar →</button>
                </div>
            </form>
        </main>
    </div>

    <!-- Referência ao JS na pasta correspondente -->
    <script src="../js/sobre-voce.js"></script>
</body>

</html>
